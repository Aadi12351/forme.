name: Verify Forme
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - run: npm test
      - run: node --check launch/launch.js
      - run: npm run build:launch
